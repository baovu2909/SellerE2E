<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seller E2E Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0/dist/umd/lucide.min.js"></script>
  <script type="module" src="/component/shared/dropdown.js"></script>
  <script type="module" src="/component/shared/dropdown-tree.js"></script>
  <script type="module" src="/component/shared/dropdown-categories.js"></script>
  <script type="module" src="/component/shared/daterange.js"></script>
  <script type="module" src="/component/shared/dialog.js"></script>
  <script type="module" src="/component/shared/filepicker.js"></script>
  <link rel="stylesheet" href="/panel.css" />
  <script type="module" src="/app.js"></script>
</head>

<body>
  <header>
    <h1><i data-lucide="shopping-cart"></i> Seller E2E — Trang điều khiển</h1>
    <label class="hdr-check" title="Mở trình duyệt để xem thao tác"><input type="checkbox" id="headed" checked /> Hiện
      trình duyệt</label>
    <div class="hdr-speed" title="Tốc độ thao tác">
      <ui-dropdown id="slowmo" value="300">
        <option value="0">Tốc độ: Nhanh</option>
        <option value="300">Tốc độ: Bình thường</option>
        <option value="800">Tốc độ: Chậm</option>
      </ui-dropdown>
    </div>
    <span class="hdr-acc" id="hdr-acc" title="Tài khoản đang dùng — bấm để đổi"><i data-lucide="circle-user"></i>
      <span></span></span>
    <button class="hdr-btn" id="seller-sync" title="Gọi lại các API bên Seller (danh mục…) để lấy dữ liệu mới nhất"><i data-lucide="refresh-cw"></i>
      Đồng Bộ</button>
    <button class="hdr-btn" id="ui" title="Xem lại từng bước, có ảnh mỗi thao tác"><i data-lucide="monitor-play"></i>
      Playwright UI</button>
    <div class="env">
      <label><input type="radio" name="env" value="dev" checked /><span>dev</span></label>
      <label><input type="radio" name="env" value="test" /><span>test</span></label>
    </div>
  </header>

  <main>
    <nav class="menu" aria-label="Nhóm chức năng">
      <div class="menu-search">
        <i data-lucide="search"></i>
        <input id="menu-search" type="search" placeholder="Tìm chức năng…" autocomplete="off" />
        <kbd>Ctrl K</kbd>
      </div>
      <div class="menu-list" id="menu-list"></div>
    </nav>

    <div class="side">
      <div class="group" data-group="auth" data-label="Đăng nhập" data-icon="key-round"></div>
      <div class="group" data-group="store" data-label="Cửa hàng" data-icon="store"></div>
      <div class="group" data-group="roles" data-label="Vai trò" data-icon="users"></div>
      <div class="group" data-group="permissions" data-label="Phân quyền" data-icon="shield-check"></div>
      <div class="group" data-group="category" data-label="Danh mục" data-icon="folder-tree"></div>
      <div class="group" data-group="product" data-label="Sản phẩm" data-icon="package"></div>
      <div class="group" data-group="order" data-label="Đơn hàng" data-icon="receipt"></div>
      <div class="group" data-group="revenue" data-label="Báo cáo" data-icon="chart-column"></div>
      <div class="group" data-group="general" data-label="Chung" data-icon="layout-grid"></div>
    </div>

    <div class="log-wrap">
      <div class="log-head">
        <div class="tabs">
          <button class="tab active" data-tab="log"><i data-lucide="terminal"></i> Log</button>
          <button class="tab" data-tab="passed"><i data-lucide="circle-check"></i> Thành công <span class="count"
              id="pass-count">0</span></button>
          <button class="tab" data-tab="failed"><i data-lucide="circle-alert"></i> Lỗi <span class="count"
              id="fail-count">0</span></button>
        </div>
        <span class="badge" id="status">Sẵn sàng</span>
        <button class="danger" id="stop" disabled><i data-lucide="square"></i> Dừng</button>
        <button class="secondary" id="clear"><i data-lucide="trash-2"></i> Xoá log</button>
      </div>
      <pre id="log" class="pane">Chọn một lệnh bên trái để chạy.</pre>
      <div id="passed" class="pane result-pane" hidden></div>
      <div id="failed" class="pane result-pane" hidden></div>
    </div>

    <div id="lightbox" hidden><img alt="Ảnh chụp màn hình" /></div>
  </main>
</body>

</html>
